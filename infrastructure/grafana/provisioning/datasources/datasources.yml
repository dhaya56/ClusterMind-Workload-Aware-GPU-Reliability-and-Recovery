apiVersion: 1

deleteDatasources:
  - name: "ClusterMind InfluxDB"
    orgId: 1

  - name: "ClusterMind Prometheus"
    orgId: 1

datasources:
  - name: "ClusterMind InfluxDB"
    uid: "clustermind-influxdb"
    type: "influxdb"
    access: "proxy"
    url: "http://influxdb:8086"
    isDefault: true
    editable: false

    jsonData:
      version: "Flux"
      organization: "clustermind"
      defaultBucket: "gpu_telemetry"
      tlsSkipVerify: true

    secureJsonData:
      token: "${INFLUXDB_TOKEN}"

  - name: "ClusterMind Prometheus"
    uid: "clustermind-prometheus"
    type: "prometheus"
    access: "proxy"
    url: "http://prometheus:9090"
    isDefault: false
    editable: false

    jsonData:
      httpMethod: "POST"
      manageAlerts: true
      prometheusType: "Prometheus"
      prometheusVersion: "3.0.0"
      cacheLevel: "High"
      disableRecordingRules: false
      incrementalQuerying: true
      incrementalQueryOverlapWindow: "10m"