apiVersion: 1

providers:
  - name: "ClusterMind Dashboards"
    orgId: 1
    folder: "ClusterMind"
    folderUid: "clustermind"
    type: "file"
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: true

    options:
      path: "/var/lib/grafana/dashboards"
      foldersFromFilesStructure: false