global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "clustermind-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "clustermind-api:8000"
        labels:
          application: "clustermind"
          component: "api"
          environment: "development"